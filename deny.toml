[graph]
all-features = true
# Dev-dependencies are outside the graph: proptest depends on rand and getrandom,
# and the ban below is on what ships, not on the test harness.
exclude-dev = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "wasm32-unknown-unknown",
]

# Network: `just audit`, never `just check`.
[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "Unlicense",
  "CC0-1.0",
]
confidence-threshold = 0.9
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
  { crate = "getrandom", reason = "core takes a seed; only the CLI may source entropy", wrappers = [
    "pawdoku-cli",
  ] },
  { crate = "rand", reason = "same", wrappers = [
    "pawdoku-cli",
  ] },
  { crate = "openssl-sys", reason = "no native TLS anywhere in this workspace" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
