include = ["**/*.toml"]
exclude = ["target/**", ".tools/**", ".pixi/**", "ai_tmp/**"]

[formatting]
column_width = 100
indent_string = "  "
align_entries = false
reorder_keys = false
reorder_arrays = false

[[rule]]
include = ["Cargo.toml", "crates/*/Cargo.toml"]
keys = ["dependencies", "dev-dependencies", "build-dependencies", "workspace.dependencies"]

[rule.formatting]
reorder_keys = true
