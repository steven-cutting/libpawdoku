[project]
name = "smoltest"
version = "0.1.0"
description = "Testcontainers-style PostgreSQL fixtures that boot in Smol Machines microVMs instead of Docker"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["smolmachines>=1.22,<2"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

[project.optional-dependencies]
cloud = ["smolmachines[tunnel]>=1.22,<2"]
psycopg = ["psycopg[binary]>=3.1"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-xdist>=3",
  "ruff>=0.6",
  "mypy>=1.10",
  "psycopg[binary]>=3.1",
]

[project.scripts]
smoltest = "smoltest.cli.main:main"

[project.entry-points.pytest11]
smoltest = "smoltest.pytest_plugin"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "smoltest"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "PERF", "PTH", "RET", "C4", "T20"]
ignore = [
  "PLR0913", # too many arguments: builder-style constructors mirror testcontainers
  "PLR0917", # too many positional arguments: same reason, the order is testcontainers'
  "PLR2004", # magic numbers in probes and tests are self-explanatory
  "RUF012",  # mutable class attributes are intentional on fakes and specs
]

[tool.ruff.lint.per-file-ignores]
"src/smoltest/cli/**" = ["T201"]
"benchmarks/**" = ["T201"]
"examples/**" = ["T201"]
"tests/**" = ["PLR0915", "PLR0912", "PLC0415", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["smoltest"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["smol", "smol.*", "psycopg", "psycopg2", "asyncpg"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "local_e2e: boots real machines on the local Smol engine (needs /dev/kvm or Apple Silicon)",
  "cloud_e2e: boots real machines on Smol Cloud (needs SMOL_CLOUD_TOKEN)",
]
addopts = "-m 'not local_e2e and not cloud_e2e' -ra"
filterwarnings = ["default"]
