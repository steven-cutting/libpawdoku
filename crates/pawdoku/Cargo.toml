[package]
name = "pawdoku"
version = "0.1.0"
description = "Classic-sudoku engine: solver, human-technique catalogue, difficulty rating, hints."
keywords = ["sudoku", "puzzle", "solver"]
categories = ["games", "algorithms", "no-std"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }

[package.metadata.docs.rs]
all-features = true
# docs.rs reads the header's path from the package root. The `doc` recipe reads
# it from the workspace root, as crates/pawdoku/rustdoc/header.html, and the
# two move together.
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "rustdoc/header.html"]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
