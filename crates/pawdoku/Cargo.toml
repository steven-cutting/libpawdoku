[package]
name = "pawdoku"
version = "0.1.0"
description = "Classic-sudoku engine: solver, human-technique catalogue, difficulty rating, hints."
keywords = ["sudoku", "puzzle", "solver"]
categories = ["games", "algorithms", "no-std"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
proptest = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

# Moves the root CHANGELOG's unreleased entries under the new version and points
# its links at the tag. The tag is named outright: {{tag_name}} is left unrendered
# under --no-tag (S02 Step 4).
[package.metadata.release]
pre-release-replacements = [
  { file = "../../CHANGELOG.md", search = "## \\[Unreleased\\]\n", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}\n", exactly = 1 },
  { file = "../../CHANGELOG.md", search = "\\[Unreleased\\]: .*", replace = "[Unreleased]: {{repository}}/compare/pawdoku-v{{version}}...HEAD\n[{{version}}]: {{repository}}/releases/tag/pawdoku-v{{version}}", exactly = 1 },
]
