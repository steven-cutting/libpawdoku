# The `metrics` gate's configuration (decision 0013 records every number and why).
# Globs resolve against the target directory, so `just metrics` runs rustqual from the
# repository root as `rustqual crates/pawdoku --config rustqual.toml`. IOSP has no
# `enabled` key and always runs; every other dimension not named on is off.

[architecture]
enabled = true

[complexity]
enabled = true
max_cognitive = 15
max_cyclomatic = 10
max_nesting_depth = 4
max_function_lines = 60
detect_magic_numbers = false

[srp]
enabled = true
max_parameters = 5
lcom4_threshold = 2
max_fields = 12
max_methods = 20

[coupling]
enabled = true
# Applies to modules something imports; rustqual exempts the rest (step 6).
max_instability = 0.8
max_fan_in = 15
max_fan_out = 12
check_sdp = true

[duplicates]
enabled = false

[boilerplate]
enabled = false

[test_quality]
enabled = false

[structural]
enabled = false

# One rule per module: everything it may not name, from
# docs/explanation/layering.md. random is in no other rule's list, since anything
# may import it, and its own rule forbids all nine: it imports nothing.
[[architecture.pattern]]
name = "sudoku_imports_nothing"
forbid_path_prefix = [
  "crate::technique",
  "crate::solver",
  "crate::reach",
  "crate::effort",
  "crate::lapse",
  "crate::human_solving",
  "crate::board",
  "crate::generation",
]
forbidden_in = ["src/sudoku{.rs,/**}"]
reason = "layering: sudoku may import only random"

