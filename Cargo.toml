[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/steven-cutting/libpawdoku"
homepage = "https://github.com/steven-cutting/libpawdoku"
authors = ["Steven Cutting"]
publish = false

[workspace.dependencies]
# The four permitted crates (decision 0007): serde and thiserror may ship;
# proptest and insta serve tests only. thiserror derives core::error::Error
# without std; serde uses alloc, never std.
# insta records values for review and change detection, tests only; json is for
# the record's snapshot in T28.
insta = { version = "1.48.0", default-features = false, features = ["json"] }
proptest = "1.11.0"
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }
thiserror = { version = "2.0.17", default-features = false }

# Every level here is `warn` so a local build never breaks mid-edit; `just clippy`
# passes `-D warnings`, which is where a warning becomes a failure.
[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unnameable_types = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "warn"
unescaped_backticks = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
use_self = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
tests_outside_test_module = "warn"
mod_module_files = "warn"
iter_over_hash_type = "warn"
str_to_string = "warn"
lossy_float_literal = "warn"
float_cmp_const = "warn"
same_name_method = "warn"
# A restriction lint, so the pedantic group does not enable it; clippy.toml sets its threshold.
cognitive_complexity = "warn"
# technique::TechniqueStep is the readable name; the lint would rename it.
module_name_repetitions = "allow"
# cargo-deny's bans.multiple-versions owns this check.
multiple_crate_versions = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
# panic stays "unwind": pyo3 turns panics into exceptions and needs it.

[profile.test]
opt-level = 1
