name: Release to crates.io

# Publishes pawdoku on a `pawdoku-v*` tag through crates.io trusted publishing
# (decision 0019). cargo-release prepares the version on the maintainer's
# machine and the release commit reaches main through a pull request; the
# maintainer tags the merge commit and pushes the tag, and this workflow
# publishes it once the `release` environment's reviewer approves, after a
# preflight job has found that environment and the tag ruleset in place. The
# pattern needs `v` straight after `pawdoku-`, so `pawdoku-wasm-v0.1.0` does
# not match it; each binding crate has a workflow of its own.

on:
  push:
    # Quoted for the reason ci.yml gives.
    tags: ['pawdoku-v*']

# Read-only unless a job says otherwise; the publish job adds id-token alone.
permissions:
  contents: read

# One run per tag, and never cancel one: a publish stopped half way through is
# worse than a second run waiting for the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_NET_RETRY: '10'
  RUST_BACKTRACE: '1'

jobs:
  # A workflow that names a missing environment does not wait: GitHub creates
  # it with no protection rules and runs the job. So before any job names
  # `release`, this one reads it and the tag rulesets, and fails closed unless
  # the environment has a required reviewer and an active tag ruleset covers
  # `refs/tags/pawdoku-v*` and restricts creating, updating and deleting it.
  # It names no environment itself, so it cannot create one, and holds no
  # id-token. It defends against a skipped or drifted setting, not against a
  # malicious tag: a tagged commit can rewrite this file, which only the
  # ruleset and the reviewer stop. The same check as release-npm.yml's.
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read for the environment; the rulesets need metadata alone.
    permissions:
      actions: read
      contents: read
    steps:
      # gh and jq are on GitHub's Ubuntu runner image; nothing is checked out.
      - name: The release environment and the tag ruleset are in place
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pattern='refs/tags/pawdoku-v*'
          if ! environment=$(gh api "repos/$GITHUB_REPOSITORY/environments/release"); then
            printf 'release: refused %s: the release environment cannot be read, and GitHub would create a missing one without protection\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          reviewers=$(jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length' <<< "$environment")
          if [ "$reviewers" -eq 0 ]; then
            printf 'release: refused %s: the release environment has no required reviewer\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/rulesets?targets=tag" --jq '.[] | select(.target == "tag" and .enforcement == "active") | .id')
          for id in $ids; do
            if gh api "repos/$GITHUB_REPOSITORY/rulesets/$id" | jq -e --arg p "$pattern" '
                (.conditions.ref_name.include // [] | any(. == $p or . == "~ALL"))
                and (.conditions.ref_name.exclude // [] | index($p) | not)
                and ([.rules[]?.type] | contains(["creation", "update", "deletion"]))' > /dev/null; then
              printf 'release: the release environment has %s required reviewer(s), and ruleset %s restricts %s\n' "$reviewers" "$id" "$pattern"
              exit 0
            fi
          done
          printf 'release: refused %s: no active tag ruleset restricts creating, updating and deleting %s\n' "$GITHUB_REF_NAME" "$pattern" >&2
          exit 1

  publish:
    name: publish
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The environment's required reviewer approves each run, and its
    # deployment policies admit the four release tag patterns alone.
    environment: release
    # id-token mints the OIDC token crates.io exchanges for a publish token.
    # GitHub grants it to the whole job, so every step below, the setup and
    # the guards included, could request one; ordering the steps does not
    # narrow it. What stops a malicious tag is the tag ruleset and this
    # environment's reviewer; the guards stop a mistaken one (decision 0019).
    # Nothing here writes to the repository.
    permissions:
      contents: read
      id-token: write
    steps:
      # The full history, which the guards' merge-base needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The full setup, not crates.io's leaner checkout, auth and publish: it
      # is the one tested path to `just` and the pinned toolchain, and every
      # step of it runs before the auth step mints the token. A tag run
      # restores caches main saved and saves none of its own.
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      - run: just check-toolchain
      # Before the auth step: a tag off main, or one that disagrees with the
      # manifest, stops here and no token is minted.
      - uses: ./.github/actions/release-guards
        with:
          package: pawdoku
      # Exchanges the run's OIDC token for a crates.io token that lives thirty
      # minutes at most; the action's post step revokes it when the job ends.
      # It runs on every tag, a re-run included, so every tag proves the
      # exchange. Its one input, `url`, defaults to crates.io.
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      # The first version is published by the maintainer's token before trusted
      # publishing can be configured, and a re-run must not fail on a version
      # that is already there. The guards proved the tag is `pawdoku-v` and the
      # manifest's version, so the suffix is that version.
      - id: published
        name: Is this version already on crates.io
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#pawdoku-v}
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --user-agent 'libpawdoku release.yml (https://github.com/steven-cutting/libpawdoku)' "https://crates.io/api/v1/crates/pawdoku/$version")
          case "$status" in
            200) printf '%s\n' "pawdoku $version is already on crates.io; nothing to publish"; echo 'exists=true' >> "$GITHUB_OUTPUT" ;;
            404) printf '%s\n' "pawdoku $version is not on crates.io yet"; echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *) printf 'crates.io answered %s for pawdoku %s; refusing to guess\n' "$status" "$version" >&2; exit 1 ;;
          esac
      # Plain cargo publish, not `cargo release publish`: the workspace's
      # release table says `publish = false`, and a tag checkout is a detached
      # HEAD, which its allow-branch refuses. The token is on this step alone.
      - if: steps.published.outputs.exists == 'false'
        run: cargo publish -p pawdoku --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
