# A working stub of the setup every CI job shares, so the one `check` job can run
# `just check`; T04 replaces it. rust-toolchain.toml, pixi.lock and tools.txt are
# the pins: nothing here restates a version they own, except pixi itself.
name: Setup
description: Install pixi and its locked environment, the pinned Rust toolchain, the tools pixi cannot own, and the hook environments.

inputs:
  cache-key:
    description: Shared key for the cargo cache, so jobs building the same thing share it.
    required: true

runs:
  using: composite
  steps:
    # The one version pin in YAML is pixi itself, which nothing else can install;
    # it must satisfy the manifest's requires-pixi. `locked` makes this step the
    # CI lockfile check. Activation puts .pixi/envs/default/bin, and so `just`,
    # on every later step's PATH; the environment holds no rust, so cargo stays
    # the runner's rustup proxy.
    - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
      with:
        pixi-version: v0.81.0
        manifest-path: pyproject.toml
        locked: true
        cache: true
        cache-write: ${{ github.ref == 'refs/heads/main' }}
        activate-environment: true

    - name: Install the pinned toolchain
      shell: bash
      run: just install-toolchain

    - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-bin: false

    # What pixi cannot own: cargo-hack from tools.txt, and allium as a side
    # effect (bg-install-allium version-checks, so a stale one is replaced).
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .tools
        key: ${{ runner.os }}-${{ runner.arch }}-tools-${{ hashFiles('tools.txt') }}

    - name: Install the tools pixi cannot own
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: just install-tools

    - name: Fetch dependencies
      shell: bash
      run: just sync

    # prek's cache outside the workspace, so check-clean's snapshot never sees
    # it (T03 confirms the variable on 0.5.3).
    - name: Point prek's cache outside the workspace
      shell: bash
      run: echo "PREK_HOME=${{ runner.temp }}/prek" >> "$GITHUB_ENV"

    # The seven hook clones, the Go, Node and rustup toolchains and the
    # ripsecrets build, which every gate job would otherwise fetch again.
    # pixi.lock is in the key because it pins prek.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/prek
        key: ${{ runner.os }}-${{ runner.arch }}-prek-${{ hashFiles('.pre-commit-config.yaml', '.pre-commit-fix.yaml', 'pixi.lock') }}

    # The prepare and the lychee warm are the point; the shim it writes into the
    # runner's .git is harmless. After this step no job step reaches the network.
    - name: Provision the hook environments
      shell: bash
      run: just install-hooks
